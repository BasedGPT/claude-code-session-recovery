name: Welcome first-time contributors

on:
  issues:
    types: [opened]
  pull_request_target:
    types: [opened]

jobs:
  welcome:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: |
            Thanks for opening your first issue here.

            To help triage, please include:
            1. The output of `python tools/diagnose.py` (read-only — safe to run any time).
            2. Your Claude Code CLI version (`claude --version`).
            3. Your Claude Desktop version (right-click the tray icon → About).
            4. Your Windows version (`winver`).

            See [SECURITY.md](../SECURITY.md) for what the diagnostic touches.
          pr-message: |
            Thanks for your first PR. Please confirm:
            - [ ] CI passes (fixture tests + sanitisation lint)
            - [ ] If you added a mutator, it has a matching fixture and passes the five mutator gates (see `docs/architecture.md`)
            - [ ] No personal paths, real UUIDs, or identifying info in committed files
